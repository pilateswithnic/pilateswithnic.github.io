<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Questionnaire · Pilates with Nic</title>
<meta name="description" content="Health questionnaire for Pilates with Nic. Completed online and sent securely.">
<meta name="theme-color" content="#0f0a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237c3f68'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23a9c3a7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&amp;family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0a12;--cream:#f5efe6;--cream-dim:rgba(245,239,230,.62);--plum:#7c3f68;--plum-deep:#43203c;--sage:#a9c3a7;--orchid:#d99ac6;--line:rgba(245,239,230,.14);--display:'Fraunces',serif;--body:'Space Grotesk',sans-serif;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);background-image:radial-gradient(1200px 700px at 85% -10%,rgba(124,63,104,.22),transparent 60%),radial-gradient(900px 600px at -10% 40%,rgba(111,143,114,.14),transparent 60%);color:var(--cream);font:400 1rem/1.65 var(--body); display:flex; flex-direction:column; min-height:100vh; align-items:center;}
::selection{background:var(--orchid);color:var(--plum-deep)}
:focus-visible{outline:2px solid var(--orchid);outline-offset:3px;border-radius:6px}
a{color:inherit}
.back{position:fixed;top:1rem;left:1rem;z-index:5;font:500 .85rem var(--body);color:var(--sage);text-decoration:none;background:rgba(15,10,18,.6);backdrop-filter:blur(8px);padding:.55rem 1rem;border-radius:999px;border:1px solid var(--line)}
.back:hover{color:var(--cream)}
header{padding:6.5rem 1.5rem 2rem;text-align:center;width:min(760px,100%);margin:0 auto}
#mandala{width:180px;margin:0 auto 1.2rem;filter:drop-shadow(0 0 26px rgba(217,154,198,.4))}
#mandala svg{width:100%;height:auto;display:block}
h1{font:400 clamp(2rem,6vw,2.8rem)/1.1 var(--display)}
h1 em{font-style:italic;color:var(--orchid)}
.intro{color:var(--cream-dim);max-width:52ch;margin:1rem auto 0;font-size:.97rem}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.95rem 1.6rem;border-radius:999px;font:600 .95rem/1 var(--body);letter-spacing:.02em;border:1px solid transparent;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s; margin-top:2.5rem}
.btn.primary{background:linear-gradient(135deg,#8a4b76,#5d2b50 55%,#3c1c38);color:#fdf7f2;box-shadow:0 8px 30px -8px rgba(217,154,198,.45)}
.btn.primary:hover{transform:translateY(-2px)}
.m-center{fill:#f5efe6}.m-c-ring{fill:none;stroke:#7c3f68;stroke-width:1.8}.m-flower{fill:#7c3f68;stroke:#f5efe6;stroke-width:1.4}.m-flower-in{fill:none;stroke:#f5efe6;stroke-width:.9;opacity:.7}.m-ring-line{fill:none;stroke:#7c3f68;stroke-width:1.2}.m-dot{fill:#f5efe6}.m-dot-plum{fill:#7c3f68}.m-band{fill:none;stroke:#7c3f68;stroke-width:14;opacity:.9}.m-band-edge{fill:none;stroke:#f5efe6;stroke-width:1.2;opacity:.8}.m-mid{fill:#a9c3a7;stroke:#7c3f68;stroke-width:1.2}.m-leaf{fill:#a9c3a7;stroke:#6f8f72;stroke-width:1.1}.m-vein{fill:none;stroke:#f5efe6;stroke-width:.7;opacity:.8}.m-out-sage{fill:#a9c3a7;stroke:#6f8f72;stroke-width:1.3}.m-out-plum{fill:#7c3f68;stroke:#43203c;stroke-width:1.3}.m-out-in{fill:none;stroke:#f5efe6;stroke-width:.9}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<a class="back" href="index.html">← Pilates with Nic</a>

<header>
  <div id="mandala" aria-hidden="true"></div>
  <h1>Health <em>questionnaire</em></h1>
  <p class="intro">A few quick questions before your first class. Click the button below to complete your secure form online.</p>
  
  <!-- Tally Button Setup -->
  <button data-tally-open="VLOeEN" data-tally-overlay="1" data-tally-emoji-text="👋" data-tally-emoji-animation="wave" data-tally-auto-close="0" class="btn primary">
    Open Health Questionnaire
  </button>
</header>

<!-- Tally Embed Script -->
<script async src="https://tally.so/widgets/embed.js"></script>

<!-- Visual Mandala Script -->
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  (() => {
    const petal = (r0, r1, w) => {
      const a = -(r0 + (r1 - r0) * .35), b = -(r1 - (r1 - r0) * .25);
      return 'M0 ' + (-r0) + ' C ' + w + ' ' + a + ', ' + w + ' ' + b + ', 0 ' + (-r1) +
             ' C ' + (-w) + ' ' + b + ', ' + (-w) + ' ' + a + ', 0 ' + (-r0) + ' Z';
    };
    const ring = (n, inner, off) => {
      off = off || 0; let s = '';
      for (let i = 0; i < n; i++) s += '<g transform="rotate(' + (off + (360 / n) * i) + ')">' + inner + '</g>';
      return s;
    };
    const dots = (n, R, r, cls) => ring(n, '<circle cy="' + (-R) + '" r="' + r + '" class="' + (cls || 'm-dot') + '"/>');
    const leaf = (r0, r1, w) => '<path d="' + petal(r0, r1, w) + '" class="m-leaf"/><path d="M 0 ' + (-r0 - 3) + ' L 0 ' + (-r1 + 5) + '" class="m-vein"/>';
    const spin = (dur, rev) => '<animateTransform attributeName="transform" type="rotate" from="' + (rev ? 360 : 0) + '" to="' + (rev ? 0 : 360) + '" dur="' + dur + 's" repeatCount="indefinite"/>';
    let outer = '';
    for (let i = 0; i < 16; i++) {
      const cls = i % 2 ? 'm-out-sage' : 'm-out-plum';
      outer += '<g transform="rotate(' + ((360 / 16) * i) + ')"><path d="' + petal(170, 245, 32) + '" class="' + cls + '"/><path d="' + petal(180, 235, 24) + '" class="m-out-in"/></g>';
    }
    let midBand = '';
    for (let i = 0; i < 12; i++) {
      midBand += i % 2 === 0
        ? '<g transform="rotate(' + ((360 / 12) * i) + ')">' + leaf(100, 145, 12) + '</g>'
        : '<g transform="rotate(' + ((360 / 12) * i) + ')"><circle cy="-125" r="4" class="m-mid"/></g>';
    }
    const flower = ring(8, '<path d="' + petal(22, 68, 18) + '" class="m-flower"/><path d="' + petal(30, 58, 12) + '" class="m-flower-in"/>');
    $('#mandala').innerHTML =
      '<svg viewBox="-270 -270 540 540">' +
      '<g>' + spin(120) + outer + '</g>' +
      '<g>' + spin(80, true) + '<circle r="155" class="m-ring-line"/><circle r="95" class="m-ring-line"/>' + midBand + dots(24, 175, 2.5, 'm-dot-plum') + dots(24, 85, 2) + '</g>' +
      '<g>' + spin(100) + '<circle r="78" class="m-band"/><circle r="72" class="m-band-edge"/><circle r="84" class="m-band-edge"/>' + flower + '<circle r="22" class="m-center"/><circle r="26" class="m-c-ring"/><circle r="18" class="m-c-ring"/><circle r="8" fill="#7c3f68"/></g>' +
      '</svg>';
    if (reduced) $('#mandala svg').pauseAnimations();
  })();
})();
</script>
</body>
</html>
