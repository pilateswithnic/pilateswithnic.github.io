<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health and Safety Questionnaire</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            background-color: #f4f4f9; 
            color: #333;
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #333; 
        }
        label { 
            font-weight: bold; 
            display: block; 
            margin-top: 15px; 
        }
        input[type="text"], input[type="email"], textarea { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        button { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 20px; 
        }
        button:hover { 
            background-color: #218838; 
        }
        .hidden { 
            display: none; 
        }
        #status-msg {
            text-align: center; 
            margin-top: 15px; 
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" id="form-content">
    <h2>Health & Safety Questionnaire</h2>
    
    <!-- Formspree Action URL Integrated Here -->
    <form id="health-form" action="https://formspree.io/f/mnpawvye" method="POST">
        
        <!-- Hidden Subject Field for Formspree -->
        <input type="hidden" name="_subject" id="email-subject" value="Health Questionnaire Submission">

        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="Client Name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="Email Address" required>

        <label for="healthConditions">Do you have any existing health conditions or injuries?</label>
        <textarea id="healthConditions" name="Health Conditions" rows="4" required></textarea>

        <button type="submit" id="submit-btn">Submit Questionnaire</button>
        <p id="status-msg" class="hidden"></p>
    </form>
</div>

<script>
    document.getElementById('health-form').addEventListener('submit', async function(event) {
        event.preventDefault(); // Prevents the page from reloading/redirecting

        const form = event.target;
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('status-msg');
        const fullName = document.getElementById('fullName').value;

        // Dynamically update the hidden subject line with the client's name
        document.getElementById('email-subject').value = `Health Questionnaire from ${fullName}`;

        // Change button state to show it is processing
        submitBtn.innerText = 'Sending...';
        submitBtn.disabled = true;

        const formData = new FormData(form);

        try {
            // Send the form data silently to Formspree
            const response = await fetch(form.action, {
                method: form.method,
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                statusMsg.innerText = "Thank you! Your questionnaire has been sent securely.";
                statusMsg.style.color = "green";
                statusMsg.classList.remove('hidden');
                form.reset(); // Clear the form
            } else {
                const data = await response.json();
                if (Object.hasOwn(data, 'errors')) {
                    statusMsg.innerText = data["errors"].map(error => error["message"]).join(", ");
                } else {
                    statusMsg.innerText = "Oops! There was a problem submitting your form.";
                }
                statusMsg.style.color = "red";
                statusMsg.classList.remove('hidden');
            }
        } catch (error) {
            statusMsg.innerText = "Oops! There was a problem submitting your form.";
            statusMsg.style.color = "red";
            statusMsg.classList.remove('hidden');
        } finally {
            // Reset button state
            submitBtn.innerText = 'Submit Questionnaire';
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
